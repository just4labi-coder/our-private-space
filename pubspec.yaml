
name: our_private_space
description: Orbit Two - a private space for two.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.4.1
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3
  firebase_auth: ^5.2.1
  cloud_firestore: ^5.4.1
  firebase_storage: ^12.3.0
  image_picker: ^1.0.8
  image_cropper: ^8.0.1
  path_provider: ^2.1.5
  video_player: ^2.8.6
  video_compress: ^3.1.3
  video_thumbnail: ^0.5.3
  shared_preferences: ^2.3.2
  googleapis: ^13.2.0
  http: ^1.2.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  record: ^6.0.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/orbit_two_logo.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/orbit_two_logo_icon.png"
  adaptive_icon_background: "assets/branding/orbit_two_icon_background.png"
  adaptive_icon_foreground: "assets/branding/orbit_two_logo_foreground.png"
  adaptive_icon_monochrome: "assets/branding/orbit_two_logo_monochrome.png"
  min_sdk_android: 23
