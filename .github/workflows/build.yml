name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes older builds so only the latest source is packaged.
# Queue builds instead of cancelling an APK build already in progress.
concurrency:
  group: orbit-two-main-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORBIT_WORKER_URL: ${{ vars.ORBIT_WORKER_URL || 'https://orbit-two-notifications.just4labi.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Flutter and Dart versions
        run: flutter --version

      - name: Configure permanent release signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/android-signing"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release-keystore.jks" >> "$GITHUB_ENV"
            echo "Permanent Android signing key configured."
          else
            echo "::warning::Permanent signing secrets are not configured. This APK uses a temporary debug key and may not update an installed copy."
          fi

      - name: Check Java environment
        run: java -version

      - name: Verify checked-in Orbit logo source
        run: |
          test -s assets/branding/orbit_two_logo.jpg.base64
          head -c 3 assets/branding/orbit_two_logo.jpg.base64 | grep -q '/9j'

      - name: Restore and convert the checked-in Orbit Two logo
        id: logo_conversion
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          source = Path("assets/branding/orbit_two_logo.jpg")
          encoded_source = Path("assets/branding/orbit_two_logo.jpg.base64")
          target = Path("assets/branding/orbit_two_logo_icon.png")
          source.write_bytes(base64.b64decode(encoded_source.read_text().strip(), validate=True))
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").save(target, format="PNG")
          with Image.open(target) as image:
              image.verify()
          print("Decoded and verified the checked-in Orbit Two logo for launcher and splash.")
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Prepare native splash logo from the actual Orbit Two artwork
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image
          source = "assets/branding/orbit_two_logo.jpg"
          target = "android/app/src/main/res/drawable-nodpi/orbit_logo.png"
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").resize((360, 360), Image.Resampling.LANCZOS).save(target, "PNG")
          with Image.open(target) as image:
              image.verify()
          print("Verified actual Orbit Two artwork for the native splash screen.")
          PY

      - name: Generate Orbit Two F launcher icon and themed monochrome layer
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          out = Path("assets/branding")
          out.mkdir(parents=True, exist_ok=True)
          size = 512
          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font = ImageFont.truetype(font_path, 380)

          # Standard launcher: Facebook-like white F on a blue background.
          icon = Image.new("RGBA", (size, size), "#1877F2")
          draw = ImageDraw.Draw(icon)
          bounds = draw.textbbox((0, 0), "F", font=font, stroke_width=0)
          text_w = bounds[2] - bounds[0]
          text_h = bounds[3] - bounds[1]
          x = (size - text_w) // 2 - bounds[0] - 8
          y = (size - text_h) // 2 - bounds[1] - 20
          draw.text((x, y), "F", font=font, fill="#FFFFFF")
          icon.save(out / "orbit_two_logo_icon.png")

          # Transparent foreground lets Android apply its adaptive-icon mask.
          foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          ImageDraw.Draw(foreground).text((x, y), "F", font=font, fill="#FFFFFFFF")
          foreground.save(out / "orbit_two_logo_foreground.png")

          # Android themed icons tint this monochrome alpha layer to match
          # the launcher's selected light/dark/theme palette.
          monochrome = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          ImageDraw.Draw(monochrome).text((x, y), "F", font=font, fill="#FFFFFFFF")
          monochrome.save(out / "orbit_two_logo_monochrome.png")

          for path in (
              out / "orbit_two_logo_icon.png",
              out / "orbit_two_logo_foreground.png",
              out / "orbit_two_logo_monochrome.png",
          ):
              with Image.open(path) as image:
                  image.verify()
              print(f"Generated and verified {path}")
          PY

      - name: Generate custom launcher icon from the verified Orbit Two logo
        run: |
          dart run flutter_launcher_icons
          sed -i 's#android:icon="@android:drawable/sym_def_app_icon"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --dart-define=ORBIT_WORKER_URL="$ORBIT_WORKER_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
