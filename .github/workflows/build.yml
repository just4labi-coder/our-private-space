name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes older builds so only the latest source is packaged.
# Queue builds instead of cancelling an APK build already in progress.
concurrency:
  group: orbit-two-main-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORBIT_WORKER_URL: ${{ vars.ORBIT_WORKER_URL || 'https://our-private-space.just4labi.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Flutter and Dart versions
        run: flutter --version

      - name: Configure permanent release signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/android-signing"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release-keystore.jks" >> "$GITHUB_ENV"
            echo "Permanent Android signing key configured."
          else
            echo "::warning::Permanent signing secrets are not configured. This APK uses a temporary debug key and may not update an installed copy."
          fi

      - name: Check Java environment
        run: java -version

      - name: Verify checked-in Orbit logo source
        run: |
          test -s assets/branding/orbit_two_logo.jpg.base64
          head -c 3 assets/branding/orbit_two_logo.jpg.base64 | grep -q '/9j'

      - name: Restore and convert the checked-in Orbit Two logo
        id: logo_conversion
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          source = Path("assets/branding/orbit_two_logo.jpg")
          encoded_source = Path("assets/branding/orbit_two_logo.jpg.base64")
          target = Path("assets/branding/orbit_two_logo_icon.png")
          source.write_bytes(base64.b64decode(encoded_source.read_text().strip(), validate=True))
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").save(target, format="PNG")
          with Image.open(target) as image:
              image.verify()
          print("Decoded and verified the checked-in Orbit Two logo for launcher and splash.")
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Generate launcher icons from the original Orbit Two artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          out = Path("assets/branding")
          source = out / "orbit_two_logo.jpg"
          size = 512

          # Remove the connected dark backdrop on the original image before
          # resizing. Keep the full landscape artwork; never crop or stretch it.
          from collections import deque
          with Image.open(source) as original:
              artwork = original.convert("RGBA")
          width, height = artwork.size
          pixels = artwork.load()
          seed = pixels[0, 0][:3]

          def is_outer_background(x, y):
              r, g, b, alpha = pixels[x, y]
              if alpha == 0 or max(r, g, b) > 112:
                  return False
              distance = ((r - seed[0]) ** 2 + (g - seed[1]) ** 2 + (b - seed[2]) ** 2) ** 0.5
              return distance <= 62

          queue = deque()
          visited = bytearray(width * height)
          for x in range(width):
              queue.append((x, 0))
              queue.append((x, height - 1))
          for y in range(height):
              queue.append((0, y))
              queue.append((width - 1, y))

          while queue:
              x, y = queue.popleft()
              index = y * width + x
              if visited[index]:
                  continue
              visited[index] = 1
              if not is_outer_background(x, y):
                  continue
              r, g, b, _ = pixels[x, y]
              pixels[x, y] = (r, g, b, 0)
              if x > 0: queue.append((x - 1, y))
              if x + 1 < width: queue.append((x + 1, y))
              if y > 0: queue.append((x, y - 1))
              if y + 1 < height: queue.append((x, y + 1))

          # Fit the complete artwork inside a transparent square canvas.
          artwork = ImageOps.contain(artwork, (size, size), method=Image.Resampling.LANCZOS)
          square = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          square.alpha_composite(artwork, ((size - artwork.width) // 2, (size - artwork.height) // 2))
          artwork = square
          pixels = artwork.load()

          # Remove the long white scan-line artifact around the centre of the
          # source. Search only the central band so the real lower logo stroke
          # is not mistaken for the unwanted line.
          # Remove the unwanted neutral-white scan line and lower white bar.
          # The real Orbit artwork uses warm peach tones, so restrict removal to
          # long, near-white horizontal runs and leave the artwork untouched.
          artifact_rows = []
          for y in range(int(size * 0.28), int(size * 0.90)):
              run = 0
              longest = 0
              for x in range(size):
                  r, g, b, a = pixels[x, y]
                  if a > 0 and min(r, g, b) >= 226 and max(r, g, b) - min(r, g, b) <= 24:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0
              if longest >= int(size * 0.18):
                  artifact_rows.append(y)

          for line_y in artifact_rows:
              for y in range(max(0, line_y - 1), min(size, line_y + 2)):
                  for x in range(size):
                      r, g, b, a = pixels[x, y]
                      if a > 0 and min(r, g, b) >= 226 and max(r, g, b) - min(r, g, b) <= 24:
                          pixels[x, y] = (r, g, b, 0)

          # Both launcher layers are transparent. Never paint a blue, black,
          # or white tile behind the original Orbit artwork.
          foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          alpha_bounds = artwork.getchannel("A").getbbox()
          if alpha_bounds is None:
              raise SystemExit("Orbit Two logo became fully transparent during background cleanup.")
          visible_artwork = artwork.crop(alpha_bounds)
          visible_artwork.save(out / "orbit_two_logo_artwork.png", format="PNG")
          safe_size = 330
          safe_artwork = ImageOps.contain(
              visible_artwork,
              (safe_size, safe_size),
              method=Image.Resampling.LANCZOS,
          )
          offset = ((size - safe_artwork.width) // 2, (size - safe_artwork.height) // 2)
          foreground.alpha_composite(safe_artwork, offset)
          icon = foreground.copy()
          icon.save(out / "orbit_two_logo_icon.png", format="PNG")
          foreground.save(out / "orbit_two_logo_foreground.png", format="PNG")
          Image.new("RGBA", (size, size), (0, 0, 0, 0)).save(
              out / "orbit_two_logo_background.png", format="PNG"
          )

          # Android themed icons use the same centered artwork's alpha mask.
          monochrome = Image.new("RGBA", (size, size), (255, 255, 255, 0))
          alpha = foreground.getchannel("A")
          monochrome.putalpha(alpha)
          monochrome.save(out / "orbit_two_logo_monochrome.png", format="PNG")

          for path in (
              out / "orbit_two_logo_artwork.png",
              out / "orbit_two_logo_icon.png",
              out / "orbit_two_logo_foreground.png",
              out / "orbit_two_logo_background.png",
              out / "orbit_two_logo_monochrome.png",
          ):
              with Image.open(path) as image:
                  image.verify()
              print(f"Generated and verified {path}")
          PY

      - name: Prepare the new image for app icon and splash only
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          branding = Path("assets/branding")
          source = branding / "orbit_two_app_icon_new.jpg"
          icon_path = branding / "orbit_two_app_icon_new_icon.png"
          foreground_path = branding / "orbit_two_app_icon_new_foreground.png"
          background_path = branding / "orbit_two_app_icon_new_background.png"
          size = 512

          with Image.open(source) as image:
              image.load()
              image = image.convert("RGBA")
          fitted = ImageOps.contain(image, (size, size), method=Image.Resampling.LANCZOS)
          square = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          square.alpha_composite(fitted, ((size - fitted.width) // 2, (size - fitted.height) // 2))
          square.save(icon_path, format="PNG")

          foreground = Image.new("RGBA", (size, size), (0, 0, 0, 0))
          safe = ImageOps.contain(image, (330, 330), method=Image.Resampling.LANCZOS)
          foreground.alpha_composite(safe, ((size - safe.width) // 2, (size - safe.height) // 2))
          foreground.save(foreground_path, format="PNG")
          Image.new("RGBA", (size, size), (0, 0, 0, 0)).save(background_path, format="PNG")

          for path in (icon_path, foreground_path, background_path):
              with Image.open(path) as generated:
                  generated.verify()
              print(f"Generated and verified {path}")
          PY

      - name: Generate custom launcher icon from the new app icon image
        run: |
          dart run flutter_launcher_icons
          sed -i 's#android:icon="@android:drawable/sym_def_app_icon"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Prepare transparent native splash logo
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image
          source = "assets/branding/orbit_two_app_icon_new_icon.png"
          target = "android/app/src/main/res/drawable-nodpi/orbit_logo.png"
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").resize((360, 360), Image.Resampling.LANCZOS).save(target, "PNG")
          with Image.open(target) as image:
              image.verify()
          print("Verified transparent, proportion-preserving Orbit Two artwork for native splash.")
          PY

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --dart-define=ORBIT_WORKER_URL="$ORBIT_WORKER_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
