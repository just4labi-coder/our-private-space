name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes older builds so only the latest source is packaged.
# Queue builds instead of cancelling an APK build already in progress.
concurrency:
  group: orbit-two-main-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORBIT_WORKER_URL: ${{ vars.ORBIT_WORKER_URL || 'https://orbit-two-notifications.just4labi.workers.dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Flutter and Dart versions
        run: flutter --version

      - name: Configure permanent release signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/android-signing"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release-keystore.jks" >> "$GITHUB_ENV"
            echo "Permanent Android signing key configured."
          else
            echo "::warning::Permanent signing secrets are not configured. This APK uses a temporary debug key and may not update an installed copy."
          fi

      - name: Check Java environment
        run: java -version

      - name: Verify checked-in Orbit logo source
        run: |
          test -s assets/branding/orbit_two_logo.jpg.base64
          head -c 3 assets/branding/orbit_two_logo.jpg.base64 | grep -q '/9j'

      - name: Restore and convert the checked-in Orbit Two logo
        id: logo_conversion
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image
          source = Path("assets/branding/orbit_two_logo.jpg")
          encoded_source = Path("assets/branding/orbit_two_logo.jpg.base64")
          target = Path("assets/branding/orbit_two_logo_icon.png")
          source.write_bytes(base64.b64decode(encoded_source.read_text().strip(), validate=True))
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").save(target, format="PNG")
          with Image.open(target) as image:
              image.verify()
          print("Decoded and verified the checked-in Orbit Two logo for launcher and splash.")
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Prepare native splash logo from the actual Orbit Two artwork
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image
          source = "assets/branding/orbit_two_logo.jpg"
          target = "android/app/src/main/res/drawable-nodpi/orbit_logo.png"
          with Image.open(source) as image:
              image.load()
              image.convert("RGBA").resize((360, 360), Image.Resampling.LANCZOS).save(target, "PNG")
          with Image.open(target) as image:
              image.verify()
          print("Verified actual Orbit Two artwork for the native splash screen.")
          PY

      - name: Generate launcher icons from the original Orbit Two artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          out = Path("assets/branding")
          source = out / "orbit_two_logo.jpg"
          size = 512

          with Image.open(source) as original:
              artwork = ImageOps.fit(
                  original.convert("RGB"),
                  (size, size),
                  method=Image.Resampling.LANCZOS,
                  centering=(0.5, 0.5),
              ).convert("RGBA")

          # The source JPEG has a dark navy/black backdrop, not pure black.
          # Flood-fill only the connected dark backdrop from the image edges.
          # This preserves dark details enclosed by the bright Orbit artwork.
          from collections import deque
          pixels = artwork.load()
          seed = pixels[0, 0][:3]

          def is_outer_background(x, y):
              r, g, b, _ = pixels[x, y]
              if max(r, g, b) > 112:
                  return False
              distance = ((r - seed[0]) ** 2 + (g - seed[1]) ** 2 + (b - seed[2]) ** 2) ** 0.5
              return distance <= 62

          queue = deque()
          visited = bytearray(size * size)
          for x in range(size):
              queue.append((x, 0))
              queue.append((x, size - 1))
          for y in range(size):
              queue.append((0, y))
              queue.append((size - 1, y))

          while queue:
              x, y = queue.popleft()
              index = y * size + x
              if visited[index]:
                  continue
              visited[index] = 1
              if not is_outer_background(x, y):
                  continue
              r, g, b, _ = pixels[x, y]
              pixels[x, y] = (r, g, b, 0)
              if x > 0: queue.append((x - 1, y))
              if x + 1 < size: queue.append((x + 1, y))
              if y > 0: queue.append((x, y - 1))
              if y + 1 < size: queue.append((x, y + 1))

          # Remove the long white scan-line artifact around the centre of the
          # source. Search only the central band so the real lower logo stroke
          # is not mistaken for the unwanted line.
          row_scores = []
          for y in range(int(size * 0.38), int(size * 0.62)):
              run = 0
              longest = 0
              for x in range(size):
                  r, g, b, a = pixels[x, y]
                  if a > 0 and min(r, g, b) >= 226 and max(r, g, b) - min(r, g, b) <= 24:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0
              row_scores.append((longest, y))
          longest, line_y = max(row_scores, default=(0, 0))
          if longest >= int(size * 0.18):
              for y in range(max(0, line_y - 1), min(size, line_y + 2)):
                  for x in range(size):
                      r, g, b, a = pixels[x, y]
                      if a > 0 and min(r, g, b) >= 226 and max(r, g, b) - min(r, g, b) <= 24:
                          pixels[x, y] = (r, g, b, 0)

          artwork.save(out / "orbit_two_logo_icon.png", format="PNG")

          # Adaptive foreground uses the same original artwork, not a generated F.
          foreground = artwork.copy()
          foreground.save(out / "orbit_two_logo_foreground.png", format="PNG")

          # The monochrome layer retains the artwork's transparency so Android
          # can tint the logo for supported themed icons.
          monochrome = Image.new("RGBA", (size, size), (255, 255, 255, 0))
          alpha = artwork.getchannel("A")
          monochrome.putalpha(alpha)
          monochrome.save(out / "orbit_two_logo_monochrome.png", format="PNG")

          for path in (
              out / "orbit_two_logo_icon.png",
              out / "orbit_two_logo_foreground.png",
              out / "orbit_two_logo_monochrome.png",
          ):
              with Image.open(path) as image:
                  image.verify()
              print(f"Generated and verified {path}")
          PY

      - name: Generate custom launcher icon from the verified Orbit Two logo
        run: |
          dart run flutter_launcher_icons
          sed -i 's#android:icon="@android:drawable/sym_def_app_icon"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --dart-define=ORBIT_WORKER_URL="$ORBIT_WORKER_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
