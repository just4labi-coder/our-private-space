name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes older builds so only the latest source is packaged.
concurrency:
  group: orbit-two-main-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ORBIT_WORKER_URL: ${{ vars.ORBIT_WORKER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: "stable"
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Flutter and Dart versions
        run: flutter --version

      - name: Configure permanent release signing
        shell: bash
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/android-signing"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-signing/release-keystore.jks" >> "$GITHUB_ENV"
            echo "Permanent Android signing key configured."
          else
            echo "::warning::Permanent signing secrets are not configured. This APK uses a temporary debug key and may not update an installed copy."
          fi

      - name: Check Java environment
        run: java -version

      - name: Verify Orbit logo asset
        run: |
          test -s assets/branding/orbit_two_logo.jpg
          file assets/branding/orbit_two_logo.jpg

      - name: Convert launcher logo to PNG (non-blocking)
        id: logo_conversion
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          if python - <<'PY'
          from PIL import Image
          source = "assets/branding/orbit_two_logo.jpg"
          target = "assets/branding/orbit_two_logo_icon.png"
          try:
              with Image.open(source) as image:
                  image.load()
                  image.convert("RGBA").save(target, format="PNG")
              print("Logo decoded and converted successfully.")
          except Exception as error:
              print(f"::warning::Logo image cannot be decoded: {error}")
              raise
          PY
          then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping launcher icon generation because the logo image is invalid. APK build will continue using the existing launcher icon."
          fi

      - name: Prepare native splash logo from the actual Orbit Two artwork
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          python - <<'PY'
          from PIL import Image, ImageDraw
          source = "assets/branding/orbit_two_logo.jpg"
          target = "android/app/src/main/res/drawable-nodpi/orbit_logo.png"
          try:
              with Image.open(source) as image:
                  image.load()
                  image.convert("RGBA").resize((360, 360), Image.Resampling.LANCZOS).save(target, "PNG")
              print("Prepared the actual Orbit Two logo for the native splash screen.")
          except Exception as error:
              print(f"::warning::Using a fallback splash mark because the logo could not be decoded: {error}")
              image = Image.new("RGBA", (360, 360), "#070513")
              draw = ImageDraw.Draw(image)
              draw.ellipse((74, 62, 192, 180), fill="#FF2E93")
              draw.ellipse((168, 62, 286, 180), fill="#FF2E93")
              draw.polygon([(74, 124), (286, 124), (180, 292)], fill="#FF2E93")
              image.save(target, "PNG")
          PY

      - name: Use safe Android launcher icon if logo conversion fails
        if: ${{ steps.logo_conversion.outputs.valid != 'true' }}
        run: |
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@android:drawable/sym_def_app_icon"#' android/app/src/main/AndroidManifest.xml

      - name: Generate custom launcher icon when logo is valid
        if: ${{ steps.logo_conversion.outputs.valid == 'true' }}
        run: |
          dart run flutter_launcher_icons
          sed -i 's#android:icon="@android:drawable/sym_def_app_icon"#android:icon="@mipmap/ic_launcher"#' android/app/src/main/AndroidManifest.xml

      - name: Generate themed launcher icon when monochrome logo is provided
        if: ${{ steps.logo_conversion.outputs.valid == 'true' && hashFiles('assets/branding/orbit_two_logo_monochrome.png') != '' }}
        run: dart run flutter_launcher_icons -f flutter_launcher_icons_monochrome.yaml

      - name: Check Cloudflare Worker JavaScript syntax
        run: node --check cloudflare-worker/src/index.js

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release --dart-define=ORBIT_WORKER_URL="$ORBIT_WORKER_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
